name: Update Claude Desktop

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-claude-desktop
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Check official stable repository
        run: nix develop -c ./scripts/update.sh
      - name: Verify and publish update
        shell: bash
        run: |
          if git diff --quiet -- sources.nix README.md; then
            echo "Already up to date."
            exit 0
          fi

          nix flake check --print-build-logs
          version=$(sed -n 's/  version = "\([^"]*\)";/\1/p' sources.nix)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md sources.nix flake.lock
          git commit -m "Keep the Nix package aligned with Claude Desktop $version" \
            -m "Pin Anthropic's latest verified stable desktop artifact and publish its update time." \
            -m $'Constraint: The upstream stable repository changes over time\nConfidence: high\nScope-risk: narrow\nTested: nix flake check --print-build-logs'
          git push
